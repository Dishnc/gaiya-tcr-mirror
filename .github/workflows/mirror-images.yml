
name: Mirror Base Images to Tencent TCR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror Base Images
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check Docker
        run: docker version

      - name: Login to Tencent TCR Personal
        shell: bash
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$TCR_USERNAME"
          test -n "$TCR_PASSWORD"

          printf '%s' "$TCR_PASSWORD" | docker login \
            ccr.ccs.tencentyun.com \
            --username "$TCR_USERNAME" \
            --password-stdin

      - name: Mirror Node.js 20 (Skip if exists)
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="node:20-bookworm-slim"
          TARGET="ccr.ccs.tencentyun.com/gaiya/node20-bookworm-slim:20-bookworm-slim"

          if docker manifest inspect "$TARGET" >/dev/null 2>&1; then
            echo "SKIP: Node.js 20 already exists in TCR."
          else
            echo "Node.js 20 not found. Starting upload."
            docker pull "$SOURCE"
            docker tag "$SOURCE" "$TARGET"
            docker push "$TARGET"
            docker manifest inspect "$TARGET" >/dev/null
            echo "Node.js 20 upload verified."
          fi

      - name: Mirror Python 3.11 (Skip if exists)
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="python:3.11-slim-bookworm"
          TARGET="ccr.ccs.tencentyun.com/gaiya/python311-slim-bookworm:3.11-slim-bookworm"

          if docker manifest inspect "$TARGET" >/dev/null 2>&1; then
            echo "SKIP: Python 3.11 already exists in TCR."
          else
            echo "Python 3.11 not found. Starting upload."
            docker pull "$SOURCE"
            docker tag "$SOURCE" "$TARGET"
            docker push "$TARGET"
            docker manifest inspect "$TARGET" >/dev/null
            echo "Python 3.11 upload verified."
          fi

      - name: Verify Both Images
        shell: bash
        run: |
          set -euo pipefail

          docker manifest inspect \
            ccr.ccs.tencentyun.com/gaiya/node20-bookworm-slim:20-bookworm-slim \
            >/dev/null

          docker manifest inspect \
            ccr.ccs.tencentyun.com/gaiya/python311-slim-bookworm:3.11-slim-bookworm \
            >/dev/null

          echo "SUCCESS: Both images exist in Tencent TCR."

      - name: Logout TCR
        if: always()
        run: docker logout ccr.ccs.tencentyun.com || true
